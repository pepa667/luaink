name: Automacao Galeria Insta Estatica

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

jobs:
  build-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Instanciar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Executar Pipeline de Scraping
        env:
          INSTA_USERNAME: ${{ secrets.INSTA_USERNAME }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
        run: node insta/get-insta-feed.js

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Garante o tracking sem falhar caso o arquivo acabe de ser criado
          git add -A www/images/insta/
          if [ -f www/insta-links.json ]; then git add www/insta-links.json; fi
          
          if git diff --cached --quiet; then
            echo "Nenhuma alteração detectada no Instagram."
          else
            git commit -m "chore: update static feed images and links [skip ci]"
            git push origin main
          fi