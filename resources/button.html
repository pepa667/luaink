<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body {
        margin: 0;
        padding: 0;
        width: 95vw;
        height: 95vh;
        }

        main {
        position: relative;
        width: 120px;
        height: 100%;
        margin: 0 auto;
        border-radius: 100vw;
        border: 2px solid red;
        }
        input{
        position: absolute;
        width: 120px;
        height:120px;
        bottom: 0px;
        border: none;
        border-radius: 100vw;
        background: green;
        outline: 3px solid rgb(0 128 0);
        outline-offset: -3px;
        }
        input:hover,
        input:focus{
        transition: 1000ms;
        outline: 50px solid rgb(0 128 0 / 0.0);
        outline-offset: 30px;
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <main>
        <section>
          <input type="button" value="teste">
        </section>
    </main>
</body>
</html>
